<title>Smoke Show Labs — Brand Development · Co-Pack · Filling</title>

<link rel="stylesheet" href="colors_and_type.css">
<style>
  html,body { margin:0; background:var(--color-bg); color:var(--color-fg); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
  *,*::before,*::after { box-sizing:border-box; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; }
  ::selection { background:var(--color-cyan); color:#000; }
  /* hide scrollbar utility */
  .ssl-noscrollbar::-webkit-scrollbar { display:none; }
  .ssl-noscrollbar { scrollbar-width:none; }
  /* link hover underline */
  .ssl-link { position:relative; }
  .ssl-link::after { content:""; position:absolute; left:0; bottom:-2px; width:0; height:1px; background:currentColor; transition:width .2s var(--ease-out); }
  .ssl-link:hover::after { width:100%; }
  /* keyboard focus */
  :focus-visible { outline:2px solid var(--color-cyan); outline-offset:2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
